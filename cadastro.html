<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cadastro-container {
            background-color: #180a0a;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            width: 320px;
            border: 1px solid #331010;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #b09e9e;
        }

        .login-link p {
            margin: 0;
        }

        .login-link a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="cadastro-container">
        <h1>Criar Conta</h1>
        
        <form id="cadastroForm">
            <input type="text" id="nome" placeholder="Nome (Ex: Beatriz)" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button type="submit">Cadastrar</button>
            <p id="mensagem"></p>
        </form>

        <div class="login-link">
            <p>Já tem uma conta? <a href="index.html">Faça login</a></p>
        </div>
    </div>

    <script>
        const cadastroForm = document.getElementById("cadastroForm");
        const nome = document.getElementById("nome");
        const senha = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");

        cadastroForm.addEventListener("submit", (e) => {
            e.preventDefault();

            localStorage.setItem("usuarioCadastrado", nome.value.trim());
            localStorage.setItem("senhaCadastrada", senha.value.trim());

            mensagem.style.color = "#ff4d4d";
            mensagem.textContent = "Cadastro realizado com sucesso!";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        });
    </script>
</body>
</html>
