<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .cadastro-container {
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            width: 300px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #03dac6;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #00bfa5;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #03dac6;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        #mensagem {
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="cadastro-container">
        <h1>Criar Conta</h1>
        
        <form id="cadastroForm">
            <input type="text" id="nome" placeholder="Nome (Ex: Beatriz)" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button type="submit">Cadastrar</button>
            <p id="mensagem"></p>
        </form>

        <div class="login-link">
            <p>Já tem uma conta? <a href="index.html">Faça login</a></p>
        </div>
    </div>

    <script>
        const cadastroForm = document.getElementById("cadastroForm");
        const nome = document.getElementById("nome");
        const senha = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");

        cadastroForm.addEventListener("submit", (e) => {
            e.preventDefault();

            localStorage.setItem("usuarioCadastrado", nome.value.trim());
            localStorage.setItem("senhaCadastrada", senha.value.trim());

            mensagem.style.color = "#03dac6";
            mensagem.textContent = "Cadastro realizado com sucesso!";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        });
    </script>
</body>
</html>
