<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d0606;
            color: #f0e6e6;
        }

        /* Menu Navigation */
        nav {
            background-color: #180a0a;
            border-bottom: 1px solid #331010;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: #b09e9e;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav ul li a:hover {
            color: #ff4d4d;
        }

        .logout-btn {
            background-color: #5c0000;
            color: white;
            border: 1px solid #800000;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #800000;
        }

        /* Conteúdo Principal */
        .container {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .welcome-card {
            background-color: #180a0a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #331010;
        }

        .welcome-card h1 {
            color: #ffffff;
            margin-top: 0;
        }

        .welcome-card p {
            color: #b09e9e;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="dashboard.html">Início</a></li>
            <li><a href="#">Projetos</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a href="#">Configurações</a></li>
        </ul>
        <button class="logout-btn" id="sairBtn">Sair</button>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h1 id="boasVindas">Bem-vinda, Beatriz! 👋</h1>
            <p>Você está autenticada no sistema. Acesse o menu acima para navegar pelas seções.</p>
        </div>
    </div>

    <script>
        const usuarioLogado = localStorage.getItem("usuarioLogado");

        if (!usuarioLogado) {
            window.location.href = "index.html";
        } else {
            document.getElementById("boasVindas").textContent = `Bem-vinda(o), ${usuarioLogado}! 👋`;
        }

        document.getElementById("sairBtn").addEventListener("click", () => {
            localStorage.removeItem("usuarioLogado");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
