<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Beatriz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        /* Menu de Navegação */
        nav {
            background-color: #333;
            color: white;
            padding: 15px;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin-right: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Conteúdo Principal */
        .container {
            padding: 20px;
        }

        .welcome-card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .welcome-card h1 {
            color: #333;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- Menu simples -->
    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Projetos</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a href="#">Configurações</a></li>
            <li><a href="#">Sair</a></li>
        </ul>
    </nav>

    <!-- Conteúdo do Dashboard -->
    <div class="container">
        <div class="welcome-card">
            <h1>Bem-vinda, Beatriz! 👋</h1>
            <p>Você está autenticada no sistema. Acesse o menu acima para navegar pelas seções.</p>
        </div>
    </div>

</body>
</html>
